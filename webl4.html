<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React API List App - Users from JSONPlaceholder</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
        }
        .app {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            padding: 30px;
            text-align: center;
        }
        h1 { margin: 0; font-size: 2.5em; color: #333; }
        .loading { text-align: center; padding: 50px; font-size: 1.2em; }
        .error { text-align: center; padding: 50px; color: #ff4757; font-size: 1.2em; }
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            padding: 30px;
        }
        @media (max-width: 768px) {
            .items-grid { grid-template-columns: 1fr; padding: 20px; }
            h1 { font-size: 2em; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ItemComponent: Displays single item with own state (toggle details)
        function ItemComponent({ item }) {
            const [showDetails, setShowDetails] = useState(false);

            return (
                <div className="item-card" style={{
                    background: 'white',
                    borderRadius: '15px',
                    padding: '25px',
                    boxShadow: '0 10px 25px rgba(0,0,0,0.1)',
                    transition: 'transform 0.3s ease, box-shadow 0.3s ease'
                }} 
                onMouseEnter={(e) => { e.currentTarget.style.transform = 'translateY(-5px)'; e.currentTarget.style.boxShadow = '0 15px 35px rgba(0,0,0,0.15)'; }}
                onMouseLeave={(e) => { e.currentTarget.style.transform = 'translateY(0)'; e.currentTarget.style.boxShadow = '0 10px 25px rgba(0,0,0,0.1)'; }}
                >
                    <h3 style={{ margin: '0 0 15px', color: '#667eea', fontSize: '1.4em' }}>
                        {item.name}
                    </h3>
                    <p style={{ margin: '0 0 15px', color: '#666' }}>
                        <strong>Username:</strong> {item.username}
                    </p>
                    <p style={{ margin: '0 0 20px', color: '#555' }}>
                        <strong>Email:</strong> {item.email}
                    </p>
                    <button 
                        onClick={() => setShowDetails(!showDetails)}
                        style={{
                            padding: '10px 20px',
                            background: '#667eea',
                            color: 'white',
                            border: 'none',
                            borderRadius: '25px',
                            cursor: 'pointer',
                            fontWeight: '600',
                            transition: 'background 0.3s'
                        }}
                        onMouseOver={(e) => e.target.style.background = '#5a67d8'}
                        onMouseOut={(e) => e.target.style.background = '#667eea'}
                    >
                        {showDetails ? 'Hide' : 'Show'} Details
                    </button>
                    {showDetails && (
                        <div style={{ marginTop: '20px', padding: '15px', background: '#f8f9ff', borderRadius: '10px', fontSize: '0.95em' }}>
                            <p><strong>Phone:</strong> {item.phone}</p>
                            <p><strong>Website:</strong> <a href={`http://${item.website}`} target="_blank" rel="noopener noreferrer" style={{ color: '#667eea' }}>{item.website}</a></p>
                            <p><strong>Company:</strong> {item.company.name}</p>
                        </div>
                    )}
                </div>
            );
        }

        // Main App Component
        function App() {
            const [items, setItems] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            useEffect(() => {
                fetch('https://jsonplaceholder.typicode.com/users')
                    .then(response => {
                        if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                        return response.json();
                    })
                    .then(data => {
                        setItems(data.slice(0, 12)); // Limit to 12 for demo
                        setLoading(false);
                    })
                    .catch(err => {
                        setError(err.message);
                        setLoading(false);
                    });
            }, []);

            if (loading) return <div className="app"><div className="header"><h1>🚀 Loading Users...</h1></div></div>;
            if (error) return <div className="app"><div className="header"><h1>❌ Error: {error}</h1></div></div>;

            return (
                <div className="app">
                    <div className="header">
                        <h1>👥 React API Users List</h1>
                        <p>Fetched from JSONPlaceholder API [{items.length} users displayed]</p>
                    </div>
                    <div className="items-grid">
                        {items.map(item => (
                            <ItemComponent key={item.id} item={item} />
                        ))}
                    </div>
                </div>
            );
        }

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
